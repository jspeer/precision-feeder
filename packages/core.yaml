# Precision Feeder: core platform setup. Always include this package.
#
# Part of the Precision Feeder ESPHome firmware (public domain, The Unlicense).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# Every value below can be overridden from your own YAML by defining the same
# name under `substitutions:`; the values here are only the defaults.
#
# The mechanism (what moves the tray) is its own package, included at the end of this file: the servo fan tray,
# packages/mechanism_servo.yaml, with its pin and settings. Another mechanism is added beside it with its own package
# (packages/mechanism_n20.yaml, the direct-drive disc) and chosen on the device (AGENTS.md, "Adding a mechanism").

substitutions:
  name: precision-feeder
  friendly_name: Precision Feeder
  fw_version: "2.1.1"
  # Which build this is, shown as Firmware Variant: "full" or "no-ble" for the prebuilt binaries (firmware/), "yaml"
  # for a build from your own YAML. The web app's update check (Firmware page) offers the matching prebuilt image only
  # to a prebuilt binary; a YAML build is updated with ESPHome. Leave it.
  fw_variant: "yaml"
  # "true" adds the last six hex digits of the board's MAC address to the name (precision-feeder-a1b2c3), so several
  # feeders built from one YAML (or the prebuilt binaries) do not share a name on the network. A name set on the
  # feeder (web app, Configuration, Network) wins over both and is used exactly as typed. With BLE, keep ble_name to 13
  # characters or fewer (ESPHome adds the suffix to the BLE name too, and refuses a longer one).
  name_add_mac_suffix: "false"

  # --- Pins (defaults suit the Waveshare ESP32-S3-Zero) -------------------
  # Starting values only when the hardware package is included: pins chosen there are saved on the feeder and win
  # (DESIGN.md section 2.1). The servo's pin, servo_pin, is in packages/mechanism_servo.yaml.
  button_pin: GPIO2            # optional push button to GND (button package only)
  status_led_pin: GPIO21       # onboard WS2812 (status LED package only)
  boot_pin: GPIO0              # the board's BOOT button: held 10 s, clears the settings password (web_server package)

  # --- Time ---------------------------------------------------------------
  # NTP is the primary time source. Leave the pool servers, or point at a
  # local NTP server if your network has no internet access. These are the starting
  # values: servers set on the feeder (NTP Servers, controls.yaml; web app, Configuration) win.
  ntp_server_1: 0.pool.ntp.org
  ntp_server_2: 1.pool.ntp.org
  ntp_server_3: 2.pool.ntp.org
  # Your timezone, as an IANA name (America/New_York) or a POSIX string.
  # Daylight saving and sunrise/sunset times depend on this being right.
  timezone: America/New_York

  # --- Network ------------------------------------------------------------
  # IPv6 alongside IPv4 (dual stack): the web app, Home Assistant and mDNS answer on both. "false" for
  # IPv4 only. ESPHome's Wi-Fi needs an IPv4 address to count as connected, so on a network with no
  # DHCPv4 give the feeder a static IPv4 address (wifi: manual_ip:); see docs/USING.md, Limits.
  enable_ipv6: "true"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: ${name_add_mac_suffix}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB              # ESP32-S3FH4R2 (Waveshare ESP32-S3-Zero H4R2)
  framework:
    type: esp-idf
    sdkconfig_options:
      # Ask all three NTP servers. ESP-IDF's default is 1, so with it the second and third were never used (found in
      # 2.0.2); the NTP Servers setting (controls.yaml) can give up to three too.
      CONFIG_LWIP_SNTP_MAX_SERVERS: "3"

logger:
  level: INFO

# Home Assistant connection. No reboot when it is lost: the feeder keeps feeding on its own.
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

# Over-the-air updates are authenticated with the same encryption key as the API
# (api: encryption: key above), so there is no separate OTA password to manage.
ota:
  - platform: esphome
    id: pf_ota                 # api_key_on_device.yaml changes it
    encryption: {}

network:
  enable_ipv6: ${enable_ipv6}
  # Count Wi-Fi as connected without waiting for an IPv6 address, so IPv4-only networks are unaffected.
  min_ipv6_addr_count: 0

# A network saved on the feeder (web app, captive portal or Improv) replaces this one. ESPHome keys the saved network to
# the build, so with a network here the YAML's comes back after the next update built from a changed YAML.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No reboot when WiFi is lost, for the same reason.
  reboot_timeout: 0s
  # If it cannot join your network it opens its own access point so you can fix the settings. With no `ssid:` here the
  # feeder names it "<name>-setup" from the name in use. A password set on the feeder (web app) replaces this one at
  # the next restart.
  ap:
    password: !secret fallback_ap_password

captive_portal:

time:
  - platform: sntp
    id: feeder_time
    timezone: ${timezone}
    servers:
      - ${ntp_server_1}
      - ${ntp_server_2}
      - ${ntp_server_3}
    # Tell the feeder where the clock came from (shown in Home Assistant, and used to decide
    # whether a clock pushed over BLE is needed).
    on_time_sync:
      - lambda: id(feeder).note_sntp_sync();

precision_feeder:
  id: feeder
  time_id: feeder_time

# What moves the tray: the servo fan tray, always. For the direct-drive disc, include packages/mechanism_n20.yaml
# in your YAML as well (examples/disc.yaml): the firmware then has both, and Drive chooses on the device.
packages:
  mechanism: !include mechanism_servo.yaml
  # Calibration Mode and tray position recovery, for every mechanism.
  recovery: !include tray_recovery.yaml
