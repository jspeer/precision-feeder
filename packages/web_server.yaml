# Precision Feeder: the built-in web app, at http://<name>.local (for example http://precision-feeder.local).
#
# Part of the Precision Feeder ESPHome firmware (MIT licence, see LICENSE).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# The whole feeder from a browser, on a computer or a phone, with no Home Assistant and no internet:
# dashboard, schedule, settings, calibration, Bluetooth and diagnostics. The app is stored in the firmware
# (web/dist/, built from web/src/ by tools/build_web.py), so nothing is loaded from the internet. It shows only
# what your build includes: leave a package out and its page or section disappears.
#
# Settings password (DESIGN.md section 10.1): none by default. Once set in the app (Configuration), changing the
# guard limits, the calibration or the pins through the web server needs it; feeding, the schedule, hold, tray
# reload and location never do. Home Assistant and BLE are not affected (they have their own keys). The password
# itself never crosses the network: the browser proves it knows it. Forgotten: hold the BOOT button for 10 seconds
# while the feeder runs; that clears the password and nothing else.
#
# To keep visitors out of the app altogether on a shared network, also uncomment `auth` below and add
# web_username / web_password to your secrets.yaml. That is HTTP authentication over plain HTTP: it keeps casual
# visitors out but is not encrypted; do not reuse a password you care about.

web_server:
  id: pf_web_server
  port: 80
  version: 3
  # The app replaces ESPHome's own dashboard script, which would otherwise be loaded from the internet.
  # These paths are relative to this file.
  local: false
  js_url: ""
  css_url: ""
  js_include: ../web/dist/app.js
  css_include: ../web/dist/app.css
  # ESPHome's own /update page stays off: it is guarded only by `auth` and checks nothing. The web app's Firmware page
  # uploads through the feeder's own handler instead (POST /feeder/firmware, firmware 2.0.0): signed with the settings
  # password when one is set, and the image's SHA-256 checked on the feeder before it switches (DESIGN.md section
  # 9.5). The encrypted ESPHome OTA (`ota:` in core.yaml) works as before.
  ota: false
  # Home Assistant and MQTT see only the feeder's everyday controls and status (firmware 2.2.0,
  # docs/plans/2.2.0-scopes.md); everything else is `internal: true`. The web app still reads and changes every one.
  include_internal: true
  # auth:
  #   username: !secret web_username
  #   password: !secret web_password

precision_feeder:
  web_server_id: pf_web_server
  # Changes through the web server that need the settings password, when one is set. "<domain>/<entity name>";
  # tests/test_consistency.py checks each one exists. The guard limits, the calibration (not Declare Tray
  # Position, which is everyday recovery), the pins (hardware.yaml, button.yaml, status_led.yaml) and the BLE
  # permissions (ble_gatt.yaml). The API and BLE keys are set through /feeder/keys/..., always signed.
  protected_entities:
    - number/Minimum Gap Between Feeds
    - number/Gap Between Portions
    - number/Daily Portion Cap
    - number/Portions Counted (24 h)
    - number/Max Portions Per Command
    - switch/Calibration Mode
    - select/Calibration Position
    - number/Calibration Offset
    - number/Servo Min Pulse
    - number/Servo Max Pulse
    - select/Board
    - select/Servo Pin
    - select/Button Pin
    - select/LED Pin
    - switch/BLE Can Change Guard Limits
    - switch/BLE Can Change Calibration

binary_sensor:
  # The BOOT button, read once the feeder is running: hold it for 10 seconds to clear the settings password.
  # (Held while the board powers up, it starts the chip's download mode instead, as always.)
  - platform: gpio
    id: pf_boot_button
    internal: true
    pin:
      number: ${boot_pin}
      mode:
        input: true
        pullup: true
      inverted: true
      # A strapping pin: only read after startup, so it does not change how the chip boots. (ESPHome refuses
      # this line for a pin that is not a strapping pin: drop it if you move boot_pin.)
      ignore_strapping_warning: true
    on_press:
      - lambda: id(feeder).boot_button(true);
    on_release:
      - lambda: id(feeder).boot_button(false);

  - platform: template
    id: pf_settings_password
    name: "Settings Password"
    internal: true
    icon: mdi:form-textbox-password
    entity_category: diagnostic
    lambda: return id(feeder).password_set();
