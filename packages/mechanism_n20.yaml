# Precision Feeder: the direct-drive disc mechanism (DESIGN.md section 3.3). core.yaml includes it on the
# variant/n20-direct-drive branch; you do not.
#
# Part of the Precision Feeder ESPHome firmware (public domain, The Unlicense).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# A GA12-N20 gear motor (6 V, 35 rpm) with a quadrature encoder, behind one channel of a DRV8833, turns a 3D-printed
# disc of open slots directly: 15 on the bench print, 24 degrees apart. One slot is always over the chute, so a load
# holds 14 portions. It only turns forward (a feed is one slot and a small wiggle); Tray Reload moves nothing.
#
# Wiring (the defaults below): motor M1 -> DRV8833 AO1, M2 -> AO2; AIN1 -> GPIO1, AIN2 -> GPIO2, STBY -> GPIO6;
# encoder C1 -> GPIO4, C2 -> GPIO5, encoder VCC -> 3V3; DRV8833 VM -> 5V; all grounds together; 100 uF across 5V
# and GND. These are the starting values: pins chosen on the feeder (the Motor and Encoder Pin selects below, web app
# Configuration) win from the next restart (D19). The button and the LED can never be moved onto them.
#
# Calibrate it before feeding: Maintenance in the web app (or the Calibration buttons below), docs/CALIBRATION.md.

substitutions:
  # Slots on the disc for a new feeder: the starting value of Disc Slots, which you set in the calibration (step 1)
  # and which is saved on the feeder from then on.
  disc_slots: "15"
  # The most portions any disc may hold (60 slots - 1): the input boxes for portions go up to this, and the feeder
  # refuses more than the disc it has. tests/test_consistency.py checks it. Leave it.
  tray_capacity: "59"
  # GPIO numbers (Waveshare ESP32-S3-Zero, as wired on the bench).
  motor_in1_pin: GPIO1         # DRV8833 AIN1
  motor_in2_pin: GPIO2         # DRV8833 AIN2
  motor_standby_pin: GPIO6     # DRV8833 STBY: low keeps the motor off
  encoder_a_pin: GPIO4         # encoder C1
  encoder_b_pin: GPIO5         # encoder C2
  motor_pwm_frequency: 20kHz   # above hearing; the DRV8833 takes up to 50 kHz

# The motion's timings and limits are YAML-only (D10); the defaults are the bench sketch's (v7). Add any of these to
# the block below to change one: start_time, first_brake, creep_brake, final_brake, settle_time, wiggle_first_brake,
# wiggle_creep_brake, wiggle_turn_brake, stall_time, drive_stall_time, timeout_base, watchdog, direction_test_time,
# pulse_start, pulse_min, pulse_max, wiggle_pulse_floor, pulse_far_ticks, wiggle_far_ticks, reverse_fault_ticks
# (components/precision_feeder_n20/__init__.py; what each does: N20Timing in mechanism_n20.h).
precision_feeder_n20:
  id: disc
  slots: ${disc_slots}
  in1_pin: ${motor_in1_pin}
  in2_pin: ${motor_in2_pin}
  standby_pin: ${motor_standby_pin}
  encoder_a_pin: ${encoder_a_pin}
  encoder_b_pin: ${encoder_b_pin}
  pwm_frequency: ${motor_pwm_frequency}

precision_feeder:
  # With the web server, changing these needs the settings password when one is set (packages/web_server.yaml has
  # the rest of the list, Calibration Mode included).
  protected_entities:
    - number/Ticks Per Turn
    - number/Drive Power
    - number/Braking Distance
    - number/Wiggle Amplitude
    - number/Wiggle Cycles
    - number/Slot Trim
    - number/Calibration Turns
    - switch/Reverse Motor
    - switch/Reverse Encoder
    - button/Calibration Start
    - button/Calibration Yes
    - button/Calibration No
    - button/Calibration Nudge 0.1°
    - button/Calibration Nudge 1°
    - button/Calibration Overshot
    - button/Calibration Zero
    - button/Calibration Run Turns
    - button/Calibration Measured
    - button/Calibration Next Slot
    - button/Calibration Trim Here
    - number/Disc Slots
    - select/Motor IN1 Pin
    - select/Motor IN2 Pin
    - select/Motor STBY Pin
    - select/Encoder A Pin
    - select/Encoder B Pin

# --- Tuning (saved on the feeder; limits from mechanism_n20.cpp's table, which tests/test_consistency.py checks) --
number:
  - platform: template
    id: pf_n20_ticks
    name: "Ticks Per Turn"
    icon: mdi:rotate-360
    entity_category: config
    unit_of_measurement: ticks
    min_value: 1000
    max_value: 100000
    step: 1
    mode: box
    # Encoder ticks for one turn of the disc. Measured by the calibration (Run Turns, then Measured).
    set_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_TICKS_PER_TURN, (int32_t) x);
    update_interval: never
  - platform: template
    id: pf_n20_power
    name: "Drive Power"
    icon: mdi:flash
    entity_category: config
    unit_of_measurement: "%"
    min_value: 20
    max_value: 100
    step: 1
    mode: box
    set_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_POWER, (int32_t) x);
    update_interval: never
  - platform: template
    id: pf_n20_braking
    name: "Braking Distance"
    icon: mdi:car-brake-hold
    entity_category: config
    unit_of_measurement: ticks
    min_value: 10
    max_value: 2000
    step: 1
    mode: box
    # Where it stops driving and starts braking and creeping, before each target. Longer: gentler, slower.
    set_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_BRAKING_DISTANCE, (int32_t) x);
    update_interval: never
  - platform: template
    id: pf_n20_wiggle_amplitude
    name: "Wiggle Amplitude"
    icon: mdi:vibrate
    entity_category: config
    unit_of_measurement: "°"
    min_value: 0.1
    max_value: 5
    step: 0.1
    mode: box
    # How far each side of the slot the wiggle goes. The wiggle is part of every feed: its last leg centres the slot.
    set_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_WIGGLE_AMPLITUDE, (int32_t) std::lround(x * 10));
    update_interval: never
  - platform: template
    id: pf_n20_wiggle_cycles
    name: "Wiggle Cycles"
    icon: mdi:sine-wave
    entity_category: config
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    set_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_WIGGLE_CYCLES, (int32_t) x);
    update_interval: never
  - platform: template
    id: pf_n20_trim
    name: "Slot Trim"
    icon: mdi:arrow-left-right
    entity_category: config
    unit_of_measurement: "°"
    min_value: -12
    max_value: 12
    step: 0.1
    mode: box
    # Shifts every slot together: + moves every stop further forward (the feeding way), - moves it back. The
    # calibration's Trim here sets it for you from a slot you nudged to the centre.
    set_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_TRIM, (int32_t) std::lround(x * 10));
    update_interval: never
  - platform: template
    id: pf_n20_slots
    name: "Disc Slots"
    icon: mdi:circle-slice-8
    entity_category: config
    min_value: 3
    max_value: 60
    step: 1
    mode: box
    # Slots on your disc, all open, one always over the chute (a load holds one fewer). Only in calibration mode:
    # changing it moves every slot, so the disc is reloaded afterwards.
    set_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_SLOTS, (int32_t) x);
    update_interval: never
  - platform: template
    id: pf_n20_cal_turns
    name: "Calibration Turns"
    icon: mdi:counter
    entity_category: config
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    # Turns the calibration measures over: more is more accurate, and takes longer (about 1.7 s a turn).
    set_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_CALIBRATION_TURNS, (int32_t) x);
    update_interval: never

  # --- Recovery (after a power cut mid-feed): nudge forward in calibration mode, then declare ---------------
  - platform: template
    id: declared_position
    name: "Declared Tray Position"
    icon: mdi:numeric
    min_value: 0
    max_value: ${tray_capacity}
    step: 1
    mode: box
    optimistic: true
    initial_value: 0

switch:
  - platform: template
    name: "Calibration Mode"
    icon: mdi:tune
    lambda: return id(feeder).calibration_mode();
    turn_on_action:
      - lambda: id(feeder).set_calibration_mode(true);
    turn_off_action:
      - lambda: id(feeder).set_calibration_mode(false);
  # Set by the calibration's direction test; change by hand only if you rewire.
  - platform: template
    name: "Reverse Motor"
    icon: mdi:swap-horizontal
    entity_category: config
    lambda: return id(feeder).tuning_value(precision_feeder::N20_REVERSE_MOTOR) != 0;
    turn_on_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_REVERSE_MOTOR, 1);
    turn_off_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_REVERSE_MOTOR, 0);
  - platform: template
    name: "Reverse Encoder"
    icon: mdi:swap-horizontal-variant
    entity_category: config
    lambda: return id(feeder).tuning_value(precision_feeder::N20_REVERSE_ENCODER) != 0;
    turn_on_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_REVERSE_ENCODER, 1);
    turn_off_action:
      - lambda: id(feeder).set_tuning(precision_feeder::N20_REVERSE_ENCODER, 0);

# --- Pins (D19): the YAML's pins above are the starting values; ones chosen here are saved on the feeder and win from
# the next restart (Restart Needed). Only pins the ESP32-S3 can spare are offered; two parts on one pin are refused.
select:
  - platform: template
    id: pf_n20_pin_in1
    name: "Motor IN1 Pin"
    icon: mdi:pin
    entity_category: config
    # DRV8833 AIN1. Every pin not in PINS_REFUSED (feeder_core.h); tests/test_consistency.py checks it.
    options: ["GPIO1", "GPIO2", "GPIO3", "GPIO4", "GPIO5", "GPIO6", "GPIO7", "GPIO8", "GPIO9", "GPIO10", "GPIO11",
                "GPIO12", "GPIO13", "GPIO14", "GPIO15", "GPIO16", "GPIO17", "GPIO18", "GPIO21", "GPIO33",
                "GPIO34", "GPIO35", "GPIO36", "GPIO37", "GPIO38", "GPIO39", "GPIO40", "GPIO41", "GPIO42",
                "GPIO43", "GPIO44", "GPIO47", "GPIO48"]
    set_action:
      - lambda: |-
          using namespace precision_feeder;
          uint8_t pin;
          if (parse_pin(x.str(), pin))
            id(feeder).set_motor_pin(0, pin);
          publish_option(id(pf_n20_pin_in1), pin_text(id(feeder).motor_pin_saved(0)));
    update_interval: never
  - platform: template
    id: pf_n20_pin_in2
    name: "Motor IN2 Pin"
    icon: mdi:pin
    entity_category: config
    # DRV8833 AIN2. Every pin not in PINS_REFUSED (feeder_core.h); tests/test_consistency.py checks it.
    options: ["GPIO1", "GPIO2", "GPIO3", "GPIO4", "GPIO5", "GPIO6", "GPIO7", "GPIO8", "GPIO9", "GPIO10", "GPIO11",
                "GPIO12", "GPIO13", "GPIO14", "GPIO15", "GPIO16", "GPIO17", "GPIO18", "GPIO21", "GPIO33",
                "GPIO34", "GPIO35", "GPIO36", "GPIO37", "GPIO38", "GPIO39", "GPIO40", "GPIO41", "GPIO42",
                "GPIO43", "GPIO44", "GPIO47", "GPIO48"]
    set_action:
      - lambda: |-
          using namespace precision_feeder;
          uint8_t pin;
          if (parse_pin(x.str(), pin))
            id(feeder).set_motor_pin(1, pin);
          publish_option(id(pf_n20_pin_in2), pin_text(id(feeder).motor_pin_saved(1)));
    update_interval: never
  - platform: template
    id: pf_n20_pin_stby
    name: "Motor STBY Pin"
    icon: mdi:pin
    entity_category: config
    # DRV8833 STBY. Every pin not in PINS_REFUSED (feeder_core.h); tests/test_consistency.py checks it.
    options: ["GPIO1", "GPIO2", "GPIO3", "GPIO4", "GPIO5", "GPIO6", "GPIO7", "GPIO8", "GPIO9", "GPIO10", "GPIO11",
                "GPIO12", "GPIO13", "GPIO14", "GPIO15", "GPIO16", "GPIO17", "GPIO18", "GPIO21", "GPIO33",
                "GPIO34", "GPIO35", "GPIO36", "GPIO37", "GPIO38", "GPIO39", "GPIO40", "GPIO41", "GPIO42",
                "GPIO43", "GPIO44", "GPIO47", "GPIO48"]
    set_action:
      - lambda: |-
          using namespace precision_feeder;
          uint8_t pin;
          if (parse_pin(x.str(), pin))
            id(feeder).set_motor_pin(2, pin);
          publish_option(id(pf_n20_pin_stby), pin_text(id(feeder).motor_pin_saved(2)));
    update_interval: never
  - platform: template
    id: pf_n20_pin_enc_a
    name: "Encoder A Pin"
    icon: mdi:pin
    entity_category: config
    # encoder C1. Every pin not in PINS_REFUSED (feeder_core.h); tests/test_consistency.py checks it.
    options: ["GPIO1", "GPIO2", "GPIO3", "GPIO4", "GPIO5", "GPIO6", "GPIO7", "GPIO8", "GPIO9", "GPIO10", "GPIO11",
                "GPIO12", "GPIO13", "GPIO14", "GPIO15", "GPIO16", "GPIO17", "GPIO18", "GPIO21", "GPIO33",
                "GPIO34", "GPIO35", "GPIO36", "GPIO37", "GPIO38", "GPIO39", "GPIO40", "GPIO41", "GPIO42",
                "GPIO43", "GPIO44", "GPIO47", "GPIO48"]
    set_action:
      - lambda: |-
          using namespace precision_feeder;
          uint8_t pin;
          if (parse_pin(x.str(), pin))
            id(feeder).set_motor_pin(3, pin);
          publish_option(id(pf_n20_pin_enc_a), pin_text(id(feeder).motor_pin_saved(3)));
    update_interval: never
  - platform: template
    id: pf_n20_pin_enc_b
    name: "Encoder B Pin"
    icon: mdi:pin
    entity_category: config
    # encoder C2. Every pin not in PINS_REFUSED (feeder_core.h); tests/test_consistency.py checks it.
    options: ["GPIO1", "GPIO2", "GPIO3", "GPIO4", "GPIO5", "GPIO6", "GPIO7", "GPIO8", "GPIO9", "GPIO10", "GPIO11",
                "GPIO12", "GPIO13", "GPIO14", "GPIO15", "GPIO16", "GPIO17", "GPIO18", "GPIO21", "GPIO33",
                "GPIO34", "GPIO35", "GPIO36", "GPIO37", "GPIO38", "GPIO39", "GPIO40", "GPIO41", "GPIO42",
                "GPIO43", "GPIO44", "GPIO47", "GPIO48"]
    set_action:
      - lambda: |-
          using namespace precision_feeder;
          uint8_t pin;
          if (parse_pin(x.str(), pin))
            id(feeder).set_motor_pin(4, pin);
          publish_option(id(pf_n20_pin_enc_b), pin_text(id(feeder).motor_pin_saved(4)));
    update_interval: never

# --- The guided calibration (calibration mode on; docs/CALIBRATION.md). Calibration Step says what comes next. ----
button:
  - platform: template
    name: "Calibration Start"
    icon: mdi:play
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_START);
  - platform: template
    name: "Calibration Yes"
    icon: mdi:check
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_YES);
  - platform: template
    name: "Calibration No"
    icon: mdi:close
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_NO);
  - platform: template
    name: "Calibration Nudge 0.1°"
    icon: mdi:chevron-right
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_NUDGE, 1);
  - platform: template
    name: "Calibration Nudge 1°"
    icon: mdi:chevron-double-right
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_NUDGE, 10);
  - platform: template
    name: "Calibration Overshot"
    icon: mdi:undo
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_OVERSHOT);
  - platform: template
    name: "Calibration Zero"
    icon: mdi:target
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_ZERO);
  - platform: template
    name: "Calibration Run Turns"
    icon: mdi:rotate-right
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_TURNS);
  - platform: template
    name: "Calibration Measured"
    icon: mdi:ruler
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_MEASURED);
  - platform: template
    name: "Calibration Next Slot"
    icon: mdi:skip-next
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_NEXT);
  # In step 4: this slot was nudged to the centre of the hole; every slot shifts by the same amount (Slot Trim).
  - platform: template
    name: "Calibration Trim Here"
    icon: mdi:crosshairs
    on_press:
      - lambda: id(feeder).calibration_action(precision_feeder::N20_CAL_TRIM_HERE);
  - platform: template
    name: "Declare Tray Position"
    icon: mdi:map-marker-check
    on_press:
      - lambda: id(feeder).declare_position((uint8_t) id(declared_position).state);

text_sensor:
  - platform: template
    id: pf_n20_step
    name: "Calibration Step"
    icon: mdi:list-status
    update_interval: never
  - platform: template
    id: pf_n20_fault
    name: "Motor Fault"
    icon: mdi:engine-off-outline
    entity_category: diagnostic
    update_interval: never

sensor:
  - platform: template
    id: pf_n20_ticks_now
    name: "Encoder Ticks"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  # Bench diagnostics: how long the last feed took, its slot move alone and the whole feed with the wiggle.
  - platform: template
    id: pf_n20_feed_move_ms
    name: "Last Feed Move Time"
    icon: mdi:timer-outline
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: pf_n20_feed_ms
    name: "Last Feed Time"
    icon: mdi:timer-outline
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: never
  # The longest gap between two motor control steps since boot (they should be 1 ms apart): the S2.0 timing check.
  - platform: template
    id: pf_n20_gap
    name: "Motor Loop Max Gap"
    icon: mdi:timer-alert-outline
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 1
    update_interval: never

interval:
  - interval: 1s
    then:
      - lambda: |-
          using namespace precision_feeder;
          auto *f = id(feeder);
          publish_number(id(pf_n20_ticks), f->tuning_value(N20_TICKS_PER_TURN));
          publish_number(id(pf_n20_power), f->tuning_value(N20_POWER));
          publish_number(id(pf_n20_braking), f->tuning_value(N20_BRAKING_DISTANCE));
          publish_number(id(pf_n20_wiggle_amplitude), f->tuning_value(N20_WIGGLE_AMPLITUDE) / 10.0f);
          publish_number(id(pf_n20_wiggle_cycles), f->tuning_value(N20_WIGGLE_CYCLES));
          publish_number(id(pf_n20_trim), f->tuning_value(N20_TRIM) / 10.0f);
          publish_number(id(pf_n20_cal_turns), f->tuning_value(N20_CALIBRATION_TURNS));
          publish_number(id(pf_n20_slots), f->tuning_value(N20_SLOTS));
          publish_text(id(pf_n20_step), f->calibration_mode() ? f->calibration_text() : "Calibration mode is off");
          publish_text(id(pf_n20_fault), f->mechanism_fault()[0] ? f->mechanism_fault() : "none");
          publish_number(id(pf_n20_ticks_now), id(disc).encoder_ticks());
          publish_number(id(pf_n20_gap), id(disc).max_gap_us() / 1000.0f);
          publish_option(id(pf_n20_pin_in1), pin_text(f->motor_pin_saved(0)));
          publish_option(id(pf_n20_pin_in2), pin_text(f->motor_pin_saved(1)));
          publish_option(id(pf_n20_pin_stby), pin_text(f->motor_pin_saved(2)));
          publish_option(id(pf_n20_pin_enc_a), pin_text(f->motor_pin_saved(3)));
          publish_option(id(pf_n20_pin_enc_b), pin_text(f->motor_pin_saved(4)));
          publish_number(id(pf_n20_feed_move_ms), id(disc).mechanism().last_feed_move_ms());
          publish_number(id(pf_n20_feed_ms), id(disc).mechanism().last_feed_ms());
