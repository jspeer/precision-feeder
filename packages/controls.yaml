# Precision Feeder: day-to-day controls and guard settings.
#
# Part of the Precision Feeder ESPHome firmware (MIT licence, see LICENSE).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# Every feed, whatever its source, goes through the same guard inside the
# component (minimum gap, daily cap, tray state, hold). These entities only
# make requests and change the guard's settings, through the component's setters,
# which check every value against the limits in feeder_core.h (the min/max below
# repeat them for the input boxes; tests/test_consistency.py keeps them in step).

button:
  - platform: template
    name: "Feed One Portion"
    icon: mdi:fish
    on_press:
      - lambda: id(feeder).request_feed(1, precision_feeder::Source::ESPHOME);

  - platform: template
    name: "Feed Selected Portions"
    icon: mdi:fish
    on_press:
      - lambda: id(feeder).request_feed((uint8_t) id(manual_portions).state, precision_feeder::Source::ESPHOME);

  - platform: template
    name: "Tray Reload"
    icon: mdi:tray-full
    # Press BEFORE loading the tray: it returns to position 0 (the closed slot, so food cannot fall
    # out), marks all 6 portions as available, and pauses scheduled feeding so you can load it.
    on_press:
      - lambda: id(feeder).tray_reload();

  - platform: template
    name: "Stop"
    icon: mdi:stop
    on_press:
      - lambda: id(feeder).stop();

  - platform: template
    name: "Hold Scheduled Feeding"
    icon: mdi:pause-circle-outline
    # Pauses the schedule for "Hold Duration" hours, or until you cancel it if that is 0.
    # Manual feeds still work, and missed events are not made up afterwards.
    on_press:
      - lambda: |-
          const uint32_t hours = (uint32_t) id(hold_hours).state;
          if (hours == 0) {
            id(feeder).set_hold_indefinite();
          } else {
            id(feeder).set_hold_minutes(hours * 60);
          }

  - platform: template
    name: "Cancel Hold"
    icon: mdi:play-circle-outline
    on_press:
      - lambda: id(feeder).cancel_hold();

switch:
  - platform: template
    name: "Scheduler"
    icon: mdi:calendar-check
    lambda: return id(feeder).cfg.scheduler_enabled != 0;
    turn_on_action:
      - lambda: id(feeder).set_scheduler_enabled(true);
    turn_off_action:
      - lambda: id(feeder).set_scheduler_enabled(false);

select:
  - platform: template
    id: pf_active_profile
    name: "Active Profile"
    icon: mdi:calendar-multiple
    options: ["A", "B", "C"]
    set_action:
      - lambda: id(feeder).set_active_profile(x[0] - 'A');
    update_interval: never

number:
  - platform: template
    id: manual_portions
    name: "Manual Portions"
    icon: mdi:numeric
    min_value: 1
    max_value: ${tray_capacity}
    step: 1
    mode: box
    optimistic: true
    initial_value: 1

  - platform: template
    id: hold_hours
    name: "Hold Duration"
    icon: mdi:timer-sand
    unit_of_measurement: h
    # 0 = hold until cancelled. The upper bound is only a sanity limit for the input box (about 11 years).
    min_value: 0
    max_value: 100000
    step: 1
    mode: box
    optimistic: true
    initial_value: 24

  # --- Guard settings -------------------------------------------------------
  - platform: template
    id: pf_minimum_gap_between_feeds
    name: "Minimum Gap Between Feeds"
    internal: true
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 1
    mode: box
    set_action:
      - lambda: id(feeder).set_min_gap_s((int32_t) std::lround(x));
    update_interval: never

  - platform: template
    id: pf_gap_between_portions
    name: "Gap Between Portions"
    internal: true
    entity_category: config
    unit_of_measurement: s
    min_value: 1
    max_value: 60
    step: 1
    mode: box
    set_action:
      - lambda: id(feeder).set_portion_gap_s((int32_t) std::lround(x));
    update_interval: never

  - platform: template
    id: pf_daily_portion_cap
    name: "Daily Portion Cap"
    internal: true
    entity_category: config
    icon: mdi:shield-check
    min_value: 1
    max_value: ${tray_capacity}
    step: 1
    mode: box
    set_action:
      - lambda: id(feeder).set_daily_cap((int32_t) std::lround(x));
    update_interval: never

  # Debugging and recovery (owner decision 2026-10-14): the number of portions the
  # daily cap is counting right now (rolling 24 h). Setting it lower forgets the
  # oldest counted feeds; setting it higher adds an "adjustment" to the feed
  # history. It never feeds or moves the tray, and every change is logged.
  - platform: template
    id: pf_portions_counted_24_h
    name: "Portions Counted (24 h)"
    internal: true
    entity_category: diagnostic
    icon: mdi:counter
    min_value: 0
    max_value: 24
    step: 1
    mode: box
    set_action:
      - lambda: id(feeder).set_portions_24h((uint16_t) x);
    update_interval: never

  - platform: template
    id: pf_max_portions_per_command
    name: "Max Portions Per Command"
    internal: true
    entity_category: config
    icon: mdi:shield-check
    min_value: 1
    max_value: ${tray_capacity}
    step: 1
    mode: box
    set_action:
      - lambda: id(feeder).set_max_portions_cmd((int32_t) std::lround(x));
    update_interval: never

  - platform: template
    id: pf_reload_pause
    name: "Reload Pause"
    internal: true
    entity_category: config
    unit_of_measurement: min
    min_value: 0
    max_value: 60
    step: 1
    mode: box
    # Scheduled feeding pauses this long after "Tray Reload", so you can finish loading the tray.
    set_action:
      - lambda: id(feeder).set_reload_pause_min((int32_t) std::lround(x));
    update_interval: never

  - platform: template
    id: pf_refill_interval
    name: "Refill Interval"
    internal: true
    entity_category: config
    unit_of_measurement: d
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    # How often you expect to refill. The schedule is flagged if it needs more portions than the tray holds before then.
    set_action:
      - lambda: id(feeder).set_refill_interval_days((int32_t) std::lround(x));
    update_interval: never

  # --- Location (needed only for sunrise/sunset events) --------------------
  - platform: template
    id: pf_latitude
    name: "Latitude"
    internal: true
    entity_category: config
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.0001
    mode: box
    set_action:
      - lambda: id(feeder).set_location(x, id(feeder).cfg.longitude);
    update_interval: never

  - platform: template
    id: pf_longitude
    name: "Longitude"
    internal: true
    entity_category: config
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.0001
    mode: box
    set_action:
      - lambda: id(feeder).set_location(id(feeder).cfg.latitude, x);
    update_interval: never

text:
  # --- Timezone (changes without a rebuild) ---------------------------------
  # A POSIX TZ string such as "CET-1CEST,M3.5.0,M10.5.0/3" (not an IANA name like "Europe/Berlin"). Empty means the
  # build's timezone (the timezone substitution), or the one Home Assistant sends; one set here wins over both.
  - platform: template
    id: pf_timezone
    name: "Timezone"
    internal: true
    icon: mdi:map-clock-outline
    entity_category: config
    mode: text
    min_length: 0
    max_length: 63
    set_action:
      - lambda: id(feeder).set_timezone(x);
    update_interval: never

  # --- NTP servers (changes without a rebuild; firmware 2.0.2) ----------------
  # Up to three host names or IP addresses (IPv4 or IPv6), separated by commas: "192.168.1.1" for a local server,
  # "time.cloudflare.com,pool.ntp.org". Empty means the build's (ntp_server_1 to 3 in core.yaml). Applied at once.
  # Like the timezone, not protected by the settings password (owner, 2026-10-16).
  - platform: template
    id: pf_ntp_servers
    name: "NTP Servers"
    internal: true
    icon: mdi:clock-time-four-outline
    entity_category: config
    mode: text
    min_length: 0
    max_length: 191
    set_action:
      - lambda: id(feeder).set_ntp_servers(x);
    update_interval: never

# Publish the entities above only when their value changes (see packages/status.yaml).
interval:
  - interval: 1s
    then:
      - lambda: |-
          using namespace precision_feeder;
          publish_option(id(pf_active_profile), std::string(1, (char) ('A' + id(feeder).cfg.active_profile)));
          publish_number(id(pf_minimum_gap_between_feeds), id(feeder).cfg.min_gap_s);
          publish_number(id(pf_gap_between_portions), id(feeder).cfg.portion_gap_s);
          publish_number(id(pf_daily_portion_cap), id(feeder).cfg.daily_cap);
          publish_number(id(pf_portions_counted_24_h), id(feeder).portions_24h());
          publish_number(id(pf_max_portions_per_command), id(feeder).cfg.max_portions_cmd);
          publish_number(id(pf_reload_pause), id(feeder).cfg.reload_pause_min);
          publish_number(id(pf_refill_interval), id(feeder).cfg.refill_interval_days);
          publish_number(id(pf_latitude), id(feeder).cfg.latitude);
          publish_number(id(pf_longitude), id(feeder).cfg.longitude);
          publish_text(id(pf_timezone), id(feeder).timezone_text());
          publish_text(id(pf_ntp_servers), id(feeder).ntp_servers_text());
