# Precision Feeder: day-to-day controls and guard settings.
#
# Part of the Precision Feeder ESPHome firmware (MIT licence).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# Every feed, whatever its source, goes through the same guard inside the
# component (minimum gap, daily cap, tray state, hold). These entities only
# make requests and change the guard's settings.

button:
  - platform: template
    name: "Feed One Portion"
    icon: mdi:fish
    on_press:
      - lambda: id(feeder).request_feed(1, precision_feeder::Source::HOME_ASSISTANT);

  - platform: template
    name: "Feed Selected Portions"
    icon: mdi:fish
    on_press:
      - lambda: id(feeder).request_feed((uint8_t) id(manual_portions).state, precision_feeder::Source::HOME_ASSISTANT);

  - platform: template
    name: "Tray Reload"
    icon: mdi:tray-full
    # Press BEFORE loading the tray: it returns to position 0 (the closed slot, so food cannot fall
    # out), marks all 6 portions as available, and pauses scheduled feeding so you can load it.
    on_press:
      - lambda: id(feeder).tray_reload();

  - platform: template
    name: "Stop"
    icon: mdi:stop
    on_press:
      - lambda: id(feeder).stop();

  - platform: template
    name: "Hold Scheduled Feeding"
    icon: mdi:pause-circle-outline
    # Pauses the schedule for "Hold Duration" hours, or until you cancel it if that is 0.
    # Manual feeds still work, and missed events are not made up afterwards.
    on_press:
      - lambda: |-
          const uint32_t hours = (uint32_t) id(hold_hours).state;
          if (hours == 0) {
            id(feeder).set_hold_indefinite();
          } else {
            id(feeder).set_hold_minutes(hours * 60);
          }

  - platform: template
    name: "Cancel Hold"
    icon: mdi:play-circle-outline
    on_press:
      - lambda: id(feeder).cancel_hold();

switch:
  - platform: template
    name: "Scheduler"
    icon: mdi:calendar-check
    lambda: return id(feeder).cfg.scheduler_enabled != 0;
    turn_on_action:
      - lambda: |-
          id(feeder).cfg.scheduler_enabled = 1;
          id(feeder).cfg_changed();
    turn_off_action:
      - lambda: |-
          id(feeder).cfg.scheduler_enabled = 0;
          id(feeder).cfg_changed();

select:
  - platform: template
    name: "Active Profile"
    icon: mdi:calendar-multiple
    options: ["A", "B", "C"]
    lambda: return std::string(1, (char) ('A' + id(feeder).cfg.active_profile));
    set_action:
      - lambda: |-
          id(feeder).cfg.active_profile = x[0] - 'A';
          id(feeder).cfg_changed();
    update_interval: 5s

number:
  - platform: template
    id: manual_portions
    name: "Manual Portions"
    icon: mdi:numeric
    min_value: 1
    max_value: 6
    step: 1
    mode: box
    optimistic: true
    initial_value: 1

  - platform: template
    id: hold_hours
    name: "Hold Duration"
    icon: mdi:timer-sand
    unit_of_measurement: h
    # 0 = hold until cancelled. The upper bound is only a sanity limit for the input box (about 11 years).
    min_value: 0
    max_value: 100000
    step: 1
    mode: box
    optimistic: true
    initial_value: 24

  # --- Guard settings -------------------------------------------------------
  - platform: template
    name: "Minimum Gap Between Feeds"
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 1
    mode: box
    lambda: return id(feeder).cfg.min_gap_s;
    set_action:
      - lambda: |-
          id(feeder).cfg.min_gap_s = (uint16_t) x;
          id(feeder).cfg_changed();
    update_interval: 5s

  - platform: template
    name: "Gap Between Portions"
    entity_category: config
    unit_of_measurement: s
    min_value: 1
    max_value: 60
    step: 1
    mode: box
    lambda: return id(feeder).cfg.portion_gap_s;
    set_action:
      - lambda: |-
          id(feeder).cfg.portion_gap_s = (uint16_t) x;
          id(feeder).cfg_changed();
    update_interval: 5s

  - platform: template
    name: "Daily Portion Cap"
    entity_category: config
    icon: mdi:shield-check
    min_value: 1
    max_value: 6
    step: 1
    mode: box
    lambda: return id(feeder).cfg.daily_cap;
    set_action:
      - lambda: |-
          id(feeder).cfg.daily_cap = (uint8_t) x;
          id(feeder).cfg_changed();
    update_interval: 5s

  - platform: template
    name: "Max Portions Per Command"
    entity_category: config
    icon: mdi:shield-check
    min_value: 1
    max_value: 6
    step: 1
    mode: box
    lambda: return id(feeder).cfg.max_portions_cmd;
    set_action:
      - lambda: |-
          id(feeder).cfg.max_portions_cmd = (uint8_t) x;
          id(feeder).cfg_changed();
    update_interval: 5s

  - platform: template
    name: "Reload Pause"
    entity_category: config
    unit_of_measurement: min
    min_value: 0
    max_value: 60
    step: 1
    mode: box
    # Scheduled feeding pauses this long after "Tray Reload", so you can finish loading the tray.
    lambda: return id(feeder).cfg.reload_pause_min;
    set_action:
      - lambda: |-
          id(feeder).cfg.reload_pause_min = (uint16_t) x;
          id(feeder).cfg_changed();
    update_interval: 5s

  - platform: template
    name: "Refill Interval"
    entity_category: config
    unit_of_measurement: d
    min_value: 1
    max_value: 30
    step: 1
    mode: box
    # How often you expect to refill. The schedule is flagged if it needs more portions than the tray holds before then.
    lambda: return id(feeder).cfg.refill_interval_days;
    set_action:
      - lambda: |-
          id(feeder).cfg.refill_interval_days = (uint16_t) x;
          id(feeder).cfg_changed();
    update_interval: 5s

  # --- Location (needed only for sunrise/sunset events) --------------------
  - platform: template
    name: "Latitude"
    entity_category: config
    unit_of_measurement: "°"
    min_value: -90
    max_value: 90
    step: 0.0001
    mode: box
    lambda: return id(feeder).cfg.latitude;
    set_action:
      - lambda: |-
          id(feeder).cfg.latitude = x;
          id(feeder).cfg_changed();
    update_interval: 30s

  - platform: template
    name: "Longitude"
    entity_category: config
    unit_of_measurement: "°"
    min_value: -180
    max_value: 180
    step: 0.0001
    mode: box
    lambda: return id(feeder).cfg.longitude;
    set_action:
      - lambda: |-
          id(feeder).cfg.longitude = x;
          id(feeder).cfg_changed();
    update_interval: 30s
