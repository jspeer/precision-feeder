# Precision Feeder: network details (optional), shown in the web app and Home Assistant.
#
# Part of the Precision Feeder ESPHome firmware (MIT licence, see LICENSE).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# ESPHome's own Wi-Fi sensors: the network the feeder joined, its addresses and the signal strength.
# Leave this package out to save a little flash; the web app then simply does not show them.

text_sensor:
  - platform: wifi_info
    ssid:
      name: "Wi-Fi Network"
      internal: true
    # The first address, and up to three more (IPv6 adds link-local and global addresses).
    ip_address:
      name: "IP Address"
      internal: true
      address_1:
        name: "IP Address 2"
        internal: true
      address_2:
        name: "IP Address 3"
        internal: true
      address_3:
        name: "IP Address 4"
        internal: true

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    internal: true
    update_interval: 60s
