# Precision Feeder: read-only status entities. Safe to include everywhere.
#
# Part of the Precision Feeder ESPHome firmware (public domain, The Unlicense).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# The entities have no polling of their own: the interval at the bottom checks
# them all once a second and publishes only the ones whose value changed, so
# Home Assistant and the log see real changes, not the same value every few seconds.

sensor:
  - platform: template
    id: pf_tray_position
    name: "Tray Position"
    icon: mdi:rotate-right
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pf_portions_remaining
    name: "Portions Remaining"
    icon: mdi:fish
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: pf_fed_today
    name: "Portions Fed Today"
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: never

  # Days until the tray runs out under the active schedule (unknown if more than 30 days).
  - platform: template
    id: pf_runway
    name: "Runway"
    icon: mdi:calendar-clock
    unit_of_measurement: d
    accuracy_decimals: 0
    update_interval: never

  # Unknown until the clock has been set at least once.
  - platform: template
    id: pf_clock_age
    name: "Minutes Since Clock Sync"
    entity_category: diagnostic
    icon: mdi:clock-time-four-outline
    unit_of_measurement: min
    accuracy_decimals: 0
    update_interval: never

  # Portions per load: the mechanism's (6 for the servo tray). The web app uses it for every portion count.
  - platform: template
    id: pf_capacity
    name: "Capacity"
    entity_category: diagnostic
    icon: mdi:tray-full
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  # What moves the tray: "servo" for the servo fan tray (packages/mechanism_servo.yaml). The web app shows that
  # mechanism's tray drawing and calibration cards.
  - platform: template
    id: pf_mechanism
    name: "Mechanism"
    entity_category: diagnostic
    icon: mdi:cog-transfer
    update_interval: never

  - platform: template
    id: pf_tray_state
    name: "Tray State"
    icon: mdi:state-machine
    update_interval: never

  - platform: template
    id: pf_next_feed
    name: "Next Feed"
    icon: mdi:clock-outline
    update_interval: never

  - platform: template
    id: pf_hold
    name: "Hold"
    icon: mdi:pause-circle-outline
    update_interval: never

  - platform: template
    id: pf_last_feed
    name: "Last Feed"
    icon: mdi:history
    update_interval: never

  - platform: template
    id: pf_last_result
    name: "Last Result"
    icon: mdi:message-text-outline
    update_interval: never

  - platform: template
    id: pf_recent_feeds
    name: "Recent Feeds"
    icon: mdi:format-list-bulleted
    update_interval: never

  - platform: template
    id: pf_active_schedule
    name: "Active Schedule"
    icon: mdi:calendar-text
    update_interval: never

  - platform: template
    id: pf_oneshots
    name: "One-shot Feeds"
    icon: mdi:calendar-star
    update_interval: never

  - platform: template
    id: pf_empty_on
    name: "Tray Empty On"
    icon: mdi:calendar-end
    update_interval: never

  - platform: template
    id: pf_faults
    name: "Faults"
    icon: mdi:alert-circle-outline
    update_interval: never

  # Where the clock was last set from: NTP, Home Assistant, BLE, kept across restart, or none.
  - platform: template
    id: pf_time_source
    name: "Time Source"
    icon: mdi:clock-check-outline
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: pf_firmware
    name: "Firmware Version"
    entity_category: diagnostic
    update_interval: never

  # full or no-ble (prebuilt binaries) or yaml (built from your own YAML): fw_variant in core.yaml.
  - platform: template
    id: pf_firmware_variant
    name: "Firmware Variant"
    icon: mdi:package-variant
    entity_category: diagnostic
    update_interval: never

  # Today's feeds in time order, each fed / skipped / due / next / later / held, for example
  # "08:30 x1 fed; 17:30 x1 next". Worked out by the same code that runs the schedule.
  - platform: template
    id: pf_todays_feeds
    name: "Today's Feeds"
    icon: mdi:calendar-today
    update_interval: never

  # What a one-portion feed would get right now, without feeding: "ready", or the reason it would be
  # refused ("too soon", "daily cap reached", ...), in the same words as Last Result.
  - platform: template
    id: pf_feed_guard
    name: "Feed Guard"
    icon: mdi:shield-check-outline
    update_interval: never

  # The device's own local time and UTC offset, for example "Thu 2026-10-15 17:30 -05:00".
  - platform: template
    id: pf_device_time
    name: "Device Time"
    icon: mdi:clock-digital
    entity_category: diagnostic
    update_interval: never

# Binary sensors only publish when their value changes already.
binary_sensor:
  - platform: template
    name: "Clock Valid"
    entity_category: diagnostic
    lambda: return id(feeder).time_valid();

  # On when the tray is empty, or the next scheduled or one-shot feed needs more
  # portions than remain (it would be cut short). Handy as an automation trigger.
  # Off while the tray position is unknown (Faults reports that).
  - platform: template
    name: "Needs Food"
    device_class: problem
    icon: mdi:fish-off
    lambda: return id(feeder).needs_food();

  - platform: template
    name: "Schedule Over Capacity"
    icon: mdi:alert-outline
    lambda: return id(feeder).schedule_oversubscribed();

interval:
  - interval: 1s
    then:
      - lambda: |-
          using namespace precision_feeder;
          auto *f = id(feeder);
          publish_number(id(pf_tray_position), f->position());
          publish_number(id(pf_portions_remaining), f->remaining());
          publish_number(id(pf_fed_today), f->feeds_today());
          publish_number(id(pf_runway), f->runway_days() == 255 ? NAN : (float) f->runway_days());
          publish_number(id(pf_clock_age), f->time_ever_synced() ? (float) f->time_age_min() : NAN);
          publish_number(id(pf_capacity), f->capacity());
          publish_text(id(pf_mechanism), f->mechanism().name());
          publish_text(id(pf_tray_state), f->tray_state_text());
          publish_text(id(pf_next_feed), f->next_event_text());
          publish_text(id(pf_hold), f->hold_text());
          publish_text(id(pf_last_feed), f->last_feed_text());
          publish_text(id(pf_last_result), f->last_result_text());
          publish_text(id(pf_recent_feeds), f->recent_feeds_text());
          publish_text(id(pf_active_schedule), f->schedule_summary());
          publish_text(id(pf_oneshots), f->oneshots_text());
          publish_text(id(pf_empty_on), f->empty_on_text());
          publish_text(id(pf_faults), f->faults_text());
          publish_text(id(pf_time_source), f->time_source_text());
          publish_text(id(pf_firmware), "${fw_version}");
          publish_text(id(pf_firmware_variant), "${fw_variant}");
          publish_text(id(pf_todays_feeds), f->todays_feeds_text());
          publish_text(id(pf_feed_guard), f->feed_guard_text());
          publish_text(id(pf_device_time), f->device_time_text());
