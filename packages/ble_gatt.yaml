# Precision Feeder: BLE GATT control plane (optional).
#
# Part of the Precision Feeder ESPHome firmware (MIT licence, see LICENSE).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# Lets a PLC, a phone app or any BLE client feed, read status, edit the schedule,
# calibrate, and set the clock. The byte layouts are in docs/PROTOCOL.md.
#
# Leave this package out for a Home Assistant only build: BLE then costs nothing
# (about 180 KB of flash and 58 KB of RAM since 2.4.0; see DESIGN.md section 16).
#
# The UUIDs are this project's own (random, generated once). Do not reuse them
# for anything else. The low 16 bits identify the attribute.
#
# This package needs `external_components` to include precision_feeder_ble (the
# example configurations do).

substitutions:
  # Shown to BLE scanners. At most 20 characters; at most 13 with name_add_mac_suffix (ESPHome adds the MAC there too).
  ble_name: Precision Feeder

  # What to do with a clock pushed over BLE (the SET_TIME command):
  #   fallback_only  accept it only if NTP / Home Assistant has not set the clock recently.
  #                  Covers fallback AP mode, or power returning while the internet is down,
  #                  without letting a wrong PLC clock override a correct one. (recommended)
  #   always         accept any plausible value
  #   off            refuse it
  ble_time_policy: fallback_only
  # How long after the last NTP / Home Assistant sync a BLE clock is still refused, under
  # the fallback_only policy.
  ble_network_time_stale_after: 24h

# The GATT server, on ESP-IDF's NimBLE (since 2.4.0; before, ESPHome's esp32_ble and esp32_ble_server on Bluedroid,
# which cost about 33 KB more heap and 150 KB more flash). The GATT table is fixed by the protocol and lives in the
# component (gatt_table.h): the service 02dd1dd9-ba75-4bbc-bdea-306d21010001 and its characteristics, the same
# UUIDs and properties as before (docs/PROTOCOL.md). This package must not be combined with esp32_ble or anything
# built on it (bluetooth_proxy, esp32_ble_tracker, improv over BLE): the build refuses it.
#
# Pairing, if the client pairs: LE Secure Connections with bonding, so the link is encrypted; at most 3 bonds are
# kept (the oldest makes room). With no screen or keypad it is "Just Works", which does not stop a stranger
# pairing; access control is the shared key below (protocol 2 authentication, docs/PROTOCOL.md). A client that
# does not pair, such as a PLC bridge, works the same. See DESIGN.md section 10.
precision_feeder_ble:
  id: feeder_ble
  feeder: feeder
  name: ${ble_name}
  manufacturer: Precision Feeder
  model: Precision Feeder Rev2
  firmware_version: ${fw_version}
  # The shared secret for protocol 2 authentication. Give the same key to your PLC bridge or client.
  # Optional (firmware 2.0.0): a key generated or entered in the web app (Configuration, Keys) is saved on the
  # feeder and wins over this one. Without either, every client is refused until a key is set.
  key: !secret ble_key
  time_policy: ${ble_time_policy}
  network_time_stale_after: ${ble_network_time_stale_after}

# What an authenticated BLE client may change (firmware 2.0.0). Both on by default: the BLE key is an admin
# credential. Off, those writes are answered NOT_AUTHORIZED with detail 7 (docs/PROTOCOL.md); feeding, the
# schedule, the clock, hold and Declare Tray Position are never affected. Saved on the feeder, and protected by
# the settings password in the web app (web_server.yaml).
#   BLE Can Change Guard Limits   Config keys 1, 2, 5 and 6: minimum gap, gap between portions, daily cap,
#                                 portions per command
#   BLE Can Change Calibration    offsets, servo pulse range (Config keys 10, 11), CALIBRATE, JOG, SAVE_CALIBRATION
switch:
  - platform: template
    id: pf_ble_guard
    name: "BLE Can Change Guard Limits"
    internal: true
    icon: mdi:shield-lock-outline
    entity_category: config
    lambda: return id(feeder).ble_may_change_guard();
    turn_on_action:
      - lambda: id(feeder).set_ble_may_change_guard(true);
    turn_off_action:
      - lambda: id(feeder).set_ble_may_change_guard(false);
  - platform: template
    id: pf_ble_calibration
    name: "BLE Can Change Calibration"
    internal: true
    icon: mdi:tune-variant
    entity_category: config
    lambda: return id(feeder).ble_may_change_calibration();
    turn_on_action:
      - lambda: id(feeder).set_ble_may_change_calibration(true);
    turn_off_action:
      - lambda: id(feeder).set_ble_may_change_calibration(false);

# Forget BLE Bonds (firmware 2.4.3): unpairs every client that paired (a phone, say), so a lost or sold one cannot
# reconnect encrypted without pairing again; a bonded client that is connected is disconnected. Clients that never
# paired, such as a PLC bridge, are untouched, and the BLE key is not changed: a client is let in by the key, not the
# bond. Web app only (Configuration, Keys), behind the settings password.
precision_feeder:
  protected_entities:
    - button/Forget BLE Bonds

button:
  - platform: template
    id: pf_ble_forget_bonds
    name: "Forget BLE Bonds"
    internal: true
    icon: mdi:link-variant-off
    entity_category: config
    on_press:
      - lambda: id(feeder_ble).forget_bonds();

# Diagnostics for the web app's Bluetooth page (and Home Assistant, where they start disabled). Nothing here is
# secret: no key, nonce or tag, and only the last two bytes of the client's address. The activity log itself is
# served by the web server at /feeder/ble (only when the web_server package is included).
text_sensor:
  # Service UUID, protocol version, authentication, time policy, where the key comes from (none, build or device;
  # never the key itself), the two permissions above, and how many clients are paired (bonds).
  - platform: template
    id: pf_ble_info
    name: "BLE Info"
    internal: true
    icon: mdi:bluetooth-settings
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never
  # The connection and counters since boot, "connected=1;auth=1;peer=4A:21;mtu=23;since=12;last=40;..."
  # (times in seconds since boot; format in DESIGN.md section 7).
  - platform: template
    id: pf_ble_session
    name: "BLE Session"
    internal: true
    icon: mdi:bluetooth-connect
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

# Publish them only when they change (see packages/status.yaml).
interval:
  - interval: 1s
    then:
      - lambda: |-
          using namespace precision_feeder;
          publish_text(id(pf_ble_info), "service=02dd1dd9-ba75-4bbc-bdea-306d21010001;" + id(feeder_ble).info_text());
          publish_text(id(pf_ble_session), id(feeder_ble).session_text());
