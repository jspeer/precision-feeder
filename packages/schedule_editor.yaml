# Precision Feeder: schedule editor.
#
# Part of the Precision Feeder ESPHome firmware (public domain, The Unlicense).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# How to build a profile: docs/SCHEDULING.md (step by step, field reference,
# examples). In short: three profiles (A, B, C) of four events each. "Edit
# Profile" / "Edit Event" choose what the fields below change; "Active Profile"
# (controls package) chooses what runs. Edits apply straight away, so for each
# event set the anchor first, then time, days and portions, and enable it last.
#
# Event time:
#   clock anchor     -> HH:MM, for example 08:30
#   sunrise/sunset   -> signed offset, for example +03:00 (3 h after) or -00:30
# Days: "all", "none", "weekdays", "weekend", or names such as "mon,wed,fri".

text_sensor:
  - platform: template
    id: pf_edited_profile
    name: "Edited Profile"
    icon: mdi:calendar-edit
    # Summary of the profile chosen in "Edit Profile", marked [active] or [not active], with a
    # warning when its busiest day needs more portions than the Daily Portion Cap.
    update_interval: never

select:
  - platform: template
    id: pf_edit_profile
    name: "Edit Profile"
    icon: mdi:pencil
    options: ["A", "B", "C"]
    set_action:
      - lambda: id(feeder).editor_profile = x[0] - 'A';
    update_interval: never

  - platform: template
    id: pf_edit_event
    name: "Edit Event"
    icon: mdi:pencil
    options: ["1", "2", "3", "4"]
    set_action:
      - lambda: id(feeder).editor_event = x[0] - '1';
    update_interval: never

  - platform: template
    id: pf_event_anchor
    name: "Event Anchor"
    icon: mdi:weather-sunset
    options: ["clock", "sunrise", "sunset"]
    set_action:
      - lambda: |-
          uint8_t a = 0;
          if (x == "sunrise") a = 1;
          else if (x == "sunset") a = 2;
          id(feeder).set_event_anchor(a);
    update_interval: never

switch:
  - platform: template
    name: "Event Enabled"
    icon: mdi:check-circle-outline
    lambda: return id(feeder).edit_event().enabled != 0;
    turn_on_action:
      - lambda: |-
          id(feeder).edit_event().enabled = 1;
          id(feeder).cfg_changed();
    turn_off_action:
      - lambda: |-
          id(feeder).edit_event().enabled = 0;
          id(feeder).cfg_changed();

text:
  - platform: template
    id: pf_event_time
    name: "Event Time"
    icon: mdi:clock-edit-outline
    mode: text
    min_length: 0
    max_length: 8
    set_action:
      - lambda: |-
          if (!id(feeder).set_event_time_text(x)) {
            ESP_LOGW("schedule_editor", "Event time '%s' not understood", x.c_str());
          }
    update_interval: never

  - platform: template
    id: pf_event_days
    name: "Event Days"
    icon: mdi:calendar-week
    mode: text
    min_length: 0
    max_length: 40
    set_action:
      - lambda: |-
          uint8_t mask;
          if (precision_feeder::PrecisionFeeder::parse_days(x, mask)) {
            id(feeder).edit_event().days = mask;
            id(feeder).cfg_changed();
          } else {
            ESP_LOGW("schedule_editor", "Days '%s' not understood", x.c_str());
          }
    update_interval: never

  - platform: template
    id: pf_profile_fast_days
    name: "Profile Fast Days"
    icon: mdi:calendar-remove
    mode: text
    min_length: 0
    max_length: 40
    # Weekdays with no feeding at all in this profile (a "fasting day"). Same format as Event Days.
    set_action:
      - lambda: |-
          uint8_t mask;
          if (precision_feeder::PrecisionFeeder::parse_days(x, mask)) {
            id(feeder).edit_profile().fast_days = mask;
            id(feeder).cfg_changed();
          } else {
            ESP_LOGW("schedule_editor", "Days '%s' not understood", x.c_str());
          }
    update_interval: never

  - platform: template
    id: pf_add_one_shot_feed
    name: "Add One-shot Feed"
    icon: mdi:calendar-plus
    mode: text
    min_length: 0
    max_length: 20
    # A single dated feed, local time: "2026-10-20 18:00". Uses "One-shot Portions".
    set_action:
      - lambda: |-
          if (x.empty()) return;
          if (!id(feeder).add_oneshot(x, (uint8_t) id(oneshot_portions).state)) {
            ESP_LOGW("schedule_editor", "One-shot '%s' rejected (format YYYY-MM-DD HH:MM, in the future, list not full)", x.c_str());
          }
    update_interval: never

number:
  - platform: template
    id: pf_event_portions
    name: "Event Portions"
    icon: mdi:fish
    min_value: 1
    max_value: 6
    step: 1
    mode: box
    set_action:
      - lambda: |-
          id(feeder).edit_event().portions = (uint8_t) x;
          id(feeder).cfg_changed();
    update_interval: never

  - platform: template
    id: pf_profile_every_n_days
    name: "Profile Every N Days"
    icon: mdi:calendar-sync
    min_value: 1
    max_value: 14
    step: 1
    mode: box
    # 1 = every day, 2 = every other day, and so on. The cycle starts on the day it was first set; use "Restart Cycle Today" to move it.
    set_action:
      - lambda: |-
          id(feeder).edit_profile().every_n = (uint8_t) x;
          id(feeder).cfg_changed();
    update_interval: never

  - platform: template
    id: oneshot_portions
    name: "One-shot Portions"
    icon: mdi:fish
    min_value: 1
    max_value: 6
    step: 1
    mode: box
    optimistic: true
    initial_value: 1

button:
  - platform: template
    name: "Restart Cycle Today"
    icon: mdi:calendar-today
    on_press:
      - lambda: id(feeder).restart_cadence_today();

  - platform: template
    name: "Clear One-shot Feeds"
    icon: mdi:calendar-remove
    on_press:
      - lambda: id(feeder).clear_oneshots();

# Publish the entities above only when their value changes (see packages/status.yaml).
interval:
  - interval: 1s
    then:
      - lambda: |-
          using namespace precision_feeder;
          static const char *const ANCHORS[3] = {"clock", "sunrise", "sunset"};
          publish_text(id(pf_edited_profile), id(feeder).edited_profile_summary());
          publish_option(id(pf_event_anchor), ANCHORS[id(feeder).edit_event().anchor % 3]);
          publish_option(id(pf_edit_profile), std::string(1, (char) ('A' + id(feeder).editor_profile)));
          publish_option(id(pf_edit_event), std::string(1, (char) ('1' + id(feeder).editor_event)));
          publish_text(id(pf_event_time), id(feeder).event_time_text());
          publish_text(id(pf_event_days), precision_feeder::PrecisionFeeder::format_days(id(feeder).edit_event().days));
          publish_text(id(pf_profile_fast_days), precision_feeder::PrecisionFeeder::format_days(id(feeder).edit_profile().fast_days));
          publish_text(id(pf_add_one_shot_feed), "");  // an input box: shown empty
          publish_number(id(pf_event_portions), id(feeder).edit_event().portions);
          publish_number(id(pf_profile_every_n_days), id(feeder).edit_profile().every_n);
