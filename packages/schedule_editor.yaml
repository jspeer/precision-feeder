# Precision Feeder: schedule editor.
#
# Part of the Precision Feeder ESPHome firmware (MIT licence).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# Three profiles (A, B, C), each with four events. Pick "Edit Profile" and
# "Edit Event", then change the fields below; edits apply straight away and are
# saved a couple of seconds later. The "Active Profile" select (controls
# package) chooses which profile the scheduler runs.
#
# Event time:
#   clock anchor     -> HH:MM, for example 08:30
#   sunrise/sunset   -> signed offset, for example +03:00 (3 h after) or -00:30
# Days: "all", "none", "weekdays", "weekend", or names such as "mon,wed,fri".

select:
  - platform: template
    name: "Edit Profile"
    icon: mdi:pencil
    options: ["A", "B", "C"]
    lambda: return std::string(1, (char) ('A' + id(feeder).editor_profile));
    set_action:
      - lambda: id(feeder).editor_profile = x[0] - 'A';
    update_interval: 2s

  - platform: template
    name: "Edit Event"
    icon: mdi:pencil
    options: ["1", "2", "3", "4"]
    lambda: return std::string(1, (char) ('1' + id(feeder).editor_event));
    set_action:
      - lambda: id(feeder).editor_event = x[0] - '1';
    update_interval: 2s

  - platform: template
    name: "Event Anchor"
    icon: mdi:weather-sunset
    options: ["clock", "sunrise", "sunset"]
    lambda: |-
      switch (id(feeder).edit_event().anchor) {
        case 1: return std::string("sunrise");
        case 2: return std::string("sunset");
        default: return std::string("clock");
      }
    set_action:
      - lambda: |-
          uint8_t a = 0;
          if (x == "sunrise") a = 1;
          else if (x == "sunset") a = 2;
          id(feeder).set_event_anchor(a);
    update_interval: 2s

switch:
  - platform: template
    name: "Event Enabled"
    icon: mdi:check-circle-outline
    lambda: return id(feeder).edit_event().enabled != 0;
    turn_on_action:
      - lambda: |-
          id(feeder).edit_event().enabled = 1;
          id(feeder).cfg_changed();
    turn_off_action:
      - lambda: |-
          id(feeder).edit_event().enabled = 0;
          id(feeder).cfg_changed();

text:
  - platform: template
    name: "Event Time"
    icon: mdi:clock-edit-outline
    mode: text
    min_length: 0
    max_length: 8
    lambda: return id(feeder).event_time_text();
    set_action:
      - lambda: |-
          if (!id(feeder).set_event_time_text(x)) {
            ESP_LOGW("schedule_editor", "Event time '%s' not understood", x.c_str());
          }
    update_interval: 2s

  - platform: template
    name: "Event Days"
    icon: mdi:calendar-week
    mode: text
    min_length: 0
    max_length: 40
    lambda: return precision_feeder::PrecisionFeeder::format_days(id(feeder).edit_event().days);
    set_action:
      - lambda: |-
          uint8_t mask;
          if (precision_feeder::PrecisionFeeder::parse_days(x, mask)) {
            id(feeder).edit_event().days = mask;
            id(feeder).cfg_changed();
          } else {
            ESP_LOGW("schedule_editor", "Days '%s' not understood", x.c_str());
          }
    update_interval: 2s

  - platform: template
    name: "Profile Fast Days"
    icon: mdi:calendar-remove
    mode: text
    min_length: 0
    max_length: 40
    # Weekdays with no feeding at all in this profile (a "fasting day"). Same format as Event Days.
    lambda: return precision_feeder::PrecisionFeeder::format_days(id(feeder).edit_profile().fast_days);
    set_action:
      - lambda: |-
          uint8_t mask;
          if (precision_feeder::PrecisionFeeder::parse_days(x, mask)) {
            id(feeder).edit_profile().fast_days = mask;
            id(feeder).cfg_changed();
          } else {
            ESP_LOGW("schedule_editor", "Days '%s' not understood", x.c_str());
          }
    update_interval: 2s

  - platform: template
    name: "Add One-shot Feed"
    icon: mdi:calendar-plus
    mode: text
    min_length: 0
    max_length: 20
    # A single dated feed, local time: "2026-10-20 18:00". Uses "One-shot Portions".
    lambda: return std::string("");
    set_action:
      - lambda: |-
          if (x.empty()) return;
          if (!id(feeder).add_oneshot(x, (uint8_t) id(oneshot_portions).state)) {
            ESP_LOGW("schedule_editor", "One-shot '%s' rejected (format YYYY-MM-DD HH:MM, in the future, list not full)", x.c_str());
          }
    update_interval: 5s

number:
  - platform: template
    name: "Event Portions"
    icon: mdi:fish
    min_value: 1
    max_value: 6
    step: 1
    mode: box
    lambda: return id(feeder).edit_event().portions;
    set_action:
      - lambda: |-
          id(feeder).edit_event().portions = (uint8_t) x;
          id(feeder).cfg_changed();
    update_interval: 2s

  - platform: template
    name: "Profile Every N Days"
    icon: mdi:calendar-sync
    min_value: 1
    max_value: 14
    step: 1
    mode: box
    # 1 = every day, 2 = every other day, and so on. The cycle starts on the day it was first set; use "Restart Cycle Today" to move it.
    lambda: return id(feeder).edit_profile().every_n;
    set_action:
      - lambda: |-
          id(feeder).edit_profile().every_n = (uint8_t) x;
          id(feeder).cfg_changed();
    update_interval: 2s

  - platform: template
    id: oneshot_portions
    name: "One-shot Portions"
    icon: mdi:fish
    min_value: 1
    max_value: 6
    step: 1
    mode: box
    optimistic: true
    initial_value: 1

button:
  - platform: template
    name: "Restart Cycle Today"
    icon: mdi:calendar-today
    on_press:
      - lambda: id(feeder).restart_cadence_today();

  - platform: template
    name: "Clear One-shot Feeds"
    icon: mdi:calendar-remove
    on_press:
      - lambda: id(feeder).clear_oneshots();
