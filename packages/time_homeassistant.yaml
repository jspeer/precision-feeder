# Precision Feeder: Home Assistant as an additional time source (optional).
#
# Part of the Precision Feeder ESPHome firmware (public domain, The Unlicense).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# Useful when the internet (and so NTP) is down but Home Assistant is still
# reachable. NTP stays the primary source: with both enabled, whichever
# synchronises last sets the clock, and both are trustworthy. Home Assistant
# also pushes its own timezone to the device while connected.

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - lambda: id(feeder).note_time_sync(precision_feeder::TimeSource::HOME_ASSISTANT);
