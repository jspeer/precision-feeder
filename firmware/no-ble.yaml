# Precision Feeder: the prebuilt "no-ble" binary (firmware 2.0.0), as GitHub Actions builds it for the install page.
#
# Part of the Precision Feeder ESPHome firmware (public domain, The Unlicense).
# Designed and written with the assistance of an AI (Anthropic's Claude);
# reviewed by a human, but it may still contain mistakes.
#
# Not an example to copy: build your own feeder from examples/ instead. This file carries nothing personal. Every
# setting a feeder needs (Wi-Fi, name, timezone, pins, keys) is set on the device in the web app's setup wizard,
# and the values here are only the starting ones. Built by tools/build_bins.sh, which places it next to a clone
# named precision-feeder/ (as examples/ are used) with throwaway secrets: each !secret the packages read is removed
# below, so none ends up in the image.
#
# Out of the box:
#   - No Wi-Fi network: the feeder opens an access point, "precision-feeder-<6 hex digits>-setup", with no password
#     (the wizard strongly recommends setting one), or takes the network over USB from the install page (Improv).
#   - No API key: Home Assistant gives it one on adoption, or the web app makes one (Configuration, Keys).
#   - The name has the end of the board's MAC address, so several feeders do not clash.

substitutions:
  fw_variant: "n20-direct-no-ble"   # a branch variant: the update check offers it nothing (D12)
  name_add_mac_suffix: "true"
  timezone: UTC                # the wizard sets the real one (DESIGN.md section 9.4)

external_components:
  - source:
      type: local
      path: precision-feeder/components

packages:
  core: !include precision-feeder/packages/core.yaml
  status: !include precision-feeder/packages/status.yaml
  controls: !include precision-feeder/packages/controls.yaml
  schedule_editor: !include precision-feeder/packages/schedule_editor.yaml
  # calibration: !include precision-feeder/packages/calibration.yaml  # servo only: not on the direct-drive disc
  # hardware: !include precision-feeder/packages/hardware.yaml  # servo only: not on the direct-drive disc
  restart: !include precision-feeder/packages/restart.yaml   # Restart, Restart Needed, Pins In Use
  diagnostics: !include precision-feeder/packages/diagnostics.yaml
  network_info: !include precision-feeder/packages/network_info.yaml
  improv_serial: !include precision-feeder/packages/improv_serial.yaml
  web_ui: !include precision-feeder/packages/web_server.yaml
  status_led: !include precision-feeder/packages/status_led.yaml
  time_ha: !include precision-feeder/packages/time_homeassistant.yaml
  button: !include precision-feeder/packages/button.yaml
  api_key: !include precision-feeder/packages/api_key_on_device.yaml

# No network and no access-point password in the image (owner, 2026-10-16: the access point is open on a clean flash).
wifi:
  ssid: !remove
  password: !remove
  ap:
    password: !remove
