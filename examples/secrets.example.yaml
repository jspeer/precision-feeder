# Copy to secrets.yaml (which is git-ignored) and fill in your own values.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
fallback_ap_password: "change-me-12345"
# 32 random bytes, base64 encoded. Generate one with:  openssl rand -base64 32
# (Not needed with the api_key_on_device package: the key is then set on the feeder.)
api_encryption_key: "REPLACE-WITH-A-GENERATED-KEY"
# Only for builds with the BLE package: the key a BLE client must know (docs/PROTOCOL.md, Authentication).
# Generate a different one the same way:  openssl rand -base64 32
# A key made in the web app (Configuration, Keys) is saved on the feeder and wins over this one.
ble_key: "REPLACE-WITH-A-GENERATED-KEY"
# Only needed if you enable `auth` in packages/web_server.yaml:
# web_username: "feeder"
# web_password: "change-me"
